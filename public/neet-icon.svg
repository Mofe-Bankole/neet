  <rect width="512" height="512" fill="#0A0E16"/>
  
  <!-- .neet text -->
  <text x="256" y="280" 
        font-family=" 'Space Grotesk', sans-serif"
        font-size="120" 
        font-weight="800"
        letter-spacing="1.5"
