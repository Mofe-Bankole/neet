<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">Eight day proposed roadmap slide template</title><rect width="100%" height="100%" fill="#0A0E16"/><g font-family="Inter, Arial, Helvetica, sans-serif"><text x="96" y="126" font-size="56" fill="#F5F7FA" font-weight="800">.neet</text><text x="96" y="254" font-size="24" fill="#CCF23F" font-weight="600" letter-spacing="0.08em">PROPOSED EIGHT-DAY SPRINT · SOLO DEVELOPER</text><text x="96" y="402" font-size="92" fill="#F5F7FA" font-weight="800">Finish the reliable flow.</text><text x="96" y="632" font-size="24" fill="#CCF23F" font-weight="600" letter-spacing="0.08em">DAYS 1–2</text><text x="96" y="716" font-size="30" fill="#F5F7FA" font-weight="400">Wallet control + ownership</text><text x="696" y="632" font-size="24" fill="#CCF23F" font-weight="600" letter-spacing="0.08em">DAYS 3–5</text><text x="696" y="716" font-size="30" fill="#F5F7FA" font-weight="400">Payment + signed receipts</text><text x="1296" y="632" font-size="24" fill="#CCF23F" font-weight="600" letter-spacing="0.08em">DAYS 6–8</text><text x="1296" y="716" font-size="30" fill="#F5F7FA" font-weight="400">Device checks + demo evidence</text><text x="96" y="892" font-size="28" fill="#9BABCF" font-weight="400">Release only after device and real-network checks pass.</text><text x="96" y="1016" font-size="20" fill="#9BABCF" font-weight="400">DOTNEET · INDEPENDENT PRODUCT USING NIMIQ</text></g></svg>