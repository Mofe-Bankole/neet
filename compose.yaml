services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: dotneet
      POSTGRES_DB: dotneet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - dotneet-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotneet -d dotneet"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dotneet-postgres:
